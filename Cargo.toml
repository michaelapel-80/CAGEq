# Cargo workspace root. Introduced when the project grew past one crate:
#   * cageq-config-writer — renders EqAPO config + startup integrity (the leaf)
#   * cageq-sidecar       — manages the Python DSP sidecar over stdio (this hop up)
# A workspace gives one shared target/ dir and a single Cargo.lock, and lets the
# crates depend on each other later (the sidecar's result will map onto the
# writer's DeviceConfig).
[workspace]
resolver = "3"
members = [
    "cageq-config-writer",
    "cageq-sidecar",
    "cageq-watchdog",
    "cageq-core",
    "cageq-monitor",
]

# Single source of truth for the internal library crates' version (each member sets
# `version.workspace = true`). The Tauri app (cageq-app/src-tauri) is a deliberately separate
# workspace, so it carries the same number in its own manifest + tauri.conf.json (the authoritative
# product/bundle version that `getVersion()` surfaces in the UI). Bump all together per release.
[workspace.package]
version = "0.4.0"
