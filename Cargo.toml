# Cargo workspace root. Introduced when the project grew past one crate, back when it was just
#   * cageq-backend       — the EqBackend trait + neutral domain types (the new leaf)
#   * cageq-config-writer — the Equalizer APO backend: renders its config + integrity
#   * cageq-sidecar       — manages the Python DSP sidecar over stdio
# and since grown to cover the rest of `members` below too:
#   * cageq-apo           — CAGEq's own real-time APO (the audiodg-loaded COM object): DSP,
#                           filter state and the control-channel protocol (filter.md §5.3c)
#   * cageq-apo-backend   — the EqBackend impl that drives cageq-apo from the app side
#   * cageq-watchdog      — fail-safe sidecar supervisor: silent-safe-state + recovery (§7.1/§7.2)
#   * cageq-core          — orchestrator tying the sidecar/watchdog/EqBackend into one flow (§2)
#   * cageq-monitor       — post-EQ loudness/spectrum monitoring via WASAPI loopback (§5.3c)
#   * cageq-biquad        — biquad design math: analog ground truth, RBJ, warping-corrected
#                           candidates (dependency-free leaf)
#   * cageq-biquad-wasm   — cageq-biquad compiled to WebAssembly for the frontend
# A workspace gives one shared target/ dir and a single Cargo.lock, and lets the
# crates depend on each other (the sidecar's result maps onto the backend's
# DeviceConfig).
#
# `cageq-backend` exists because CAGEq is moving off Equalizer APO onto its own APO
# (filter.md §5.3c) while keeping the EqAPO path working permanently — so the
# orchestrator talks to a trait, not to a file writer. See that crate's own docs.
[workspace]
resolver = "3"
members = [
    "cageq-apo",
    "cageq-apo-backend",
    "cageq-backend",
    "cageq-biquad",
    "cageq-biquad-wasm",
    "cageq-catalog",
    "cageq-config-writer",
    "cageq-peq-solver",
    "cageq-sidecar",
    "cageq-watchdog",
    "cageq-core",
    "cageq-monitor",
]

# Single source of truth for the internal library crates' version (each member sets
# `version.workspace = true`). The Tauri app (cageq-app/src-tauri) is a deliberately separate
# workspace, so it carries the same number in its own manifest + tauri.conf.json (the authoritative
# product/bundle version that `getVersion()` surfaces in the UI). Bump all together per release.
[workspace.package]
version = "0.14.5"
license = "GPL-3.0-or-later"

# Dependencies (not workspace members — this form of the key excludes those) compile at release-
# level optimization even in a dev/debug build. Added specifically for cageq-monitor's spectrum
# analyzer: rustfft/realfft's own numeric work compiling fully unoptimized (opt-level=0, no
# vectorization/inlining/bounds-check elimination) was the dominant cost behind visible frame
# drops in debug builds at the larger FFT-window tiers — cageq-monitor's own code was a smaller,
# second-order contributor (see the `push()` drain fix, same investigation) but is deliberately
# left unoptimized here so it's still normally debuggable. Costs a slower first debug build (and
# after any dependency-version bump) in exchange for every debug run afterward not chugging.
[profile.dev.package."*"]
opt-level = 3
