# Cargo workspace root. Introduced when the project grew past one crate:
#   * cageq-backend       — the EqBackend trait + neutral domain types (the new leaf)
#   * cageq-config-writer — the Equalizer APO backend: renders its config + integrity
#   * cageq-sidecar       — manages the Python DSP sidecar over stdio
# A workspace gives one shared target/ dir and a single Cargo.lock, and lets the
# crates depend on each other (the sidecar's result maps onto the backend's
# DeviceConfig).
#
# `cageq-backend` exists because CAGEq is moving off Equalizer APO onto its own APO
# (filter.md §5.3c) while keeping the EqAPO path working permanently — so the
# orchestrator talks to a trait, not to a file writer. See that crate's own docs.
[workspace]
resolver = "3"
members = [
    "cageq-apo",
    "cageq-apo-backend",
    "cageq-backend",
    "cageq-config-writer",
    "cageq-sidecar",
    "cageq-watchdog",
    "cageq-core",
    "cageq-monitor",
]

# Single source of truth for the internal library crates' version (each member sets
# `version.workspace = true`). The Tauri app (cageq-app/src-tauri) is a deliberately separate
# workspace, so it carries the same number in its own manifest + tauri.conf.json (the authoritative
# product/bundle version that `getVersion()` surfaces in the UI). Bump all together per release.
[workspace.package]
version = "0.10.0"
license = "GPL-3.0-or-later"
