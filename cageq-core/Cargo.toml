cageq-config-writer = { path = "../cageq-config-writer" }
cageq-sidecar = { path = "../cageq-sidecar" }
cageq-watchdog = { path = "../cageq-watchdog" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
