[package]
name = "cageq-core"
version.workspace = true
edition = "2024"

[dependencies]
# The orchestrator ties the building blocks together. It drives EQ through the
# `cageq-backend` trait, not a concrete backend — `cageq-config-writer` (the Equalizer
# APO one) is still depended on only to re-export its constructor for the app layer.
cageq-backend = { path = "../cageq-backend" }
cageq-config-writer = { path = "../cageq-config-writer" }
cageq-sidecar = { path = "../cageq-sidecar" }
cageq-watchdog = { path = "../cageq-watchdog" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
