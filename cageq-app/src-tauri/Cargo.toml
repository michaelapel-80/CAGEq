[package]
name = "cageq-app"
version = "0.10.0"
description = "CAGEq — loudness-neutral A/B/Dry headphone EQ correction"
authors = ["Michael Apel"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cageq_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cageq-core = { path = "../../cageq-core" }
# §5.3c post-EQ monitoring: WASAPI loopback capture + LUFS metering (Windows-only, no-op stub
# elsewhere so the app still builds cross-platform).
cageq-monitor = { path = "../../cageq-monitor" }
# CAGEq's own APO backend (filter.md §5.3c). Depended on directly rather than through
# cageq-core: the core only needs the EqBackend trait, and which backend to construct is an
# application decision, made in `build_backend`.
cageq-apo-backend = { path = "../../cageq-apo-backend" }

# §2 single-instance: all devices share one cageq.txt, so a second CAGEq process
# would race the first on writes. Desktop-only (Cargo needs the real target cfg here;
# the `desktop` alias only exists for `#[cfg(desktop)]` in code).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Standalone workspace: keeps the Tauri app (with its heavy deps and its
# frontend-dist build requirement) out of the core Cargo workspace, so `cargo test`
# on the core crates stays fast and decoupled from the frontend build state.
[workspace]

