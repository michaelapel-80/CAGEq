[package]
name = "cageq-sidecar"
version.workspace = true
license.workspace = true
edition = "2024"

[dependencies]
# serde = the (de)serialization framework; the "derive" feature turns on the
# #[derive(Serialize, Deserialize)] macros. serde_json = the JSON format impl.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared_child = "1.1.1"
thiserror = "2.0"
