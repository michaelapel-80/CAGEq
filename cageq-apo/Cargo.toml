[package]
name = "cageq-apo"
version.workspace = true
license.workspace = true
edition = "2024"
build = "build.rs"

# A static library the C++ shim links into `CAGEqApo.dll` — see `shim/cageq_apo.cpp` and
# this crate's own docs for why the COM/audiodg half is C++ at all (short version: the
# only thing that reliably survives audiodg's load handshake is the SDK's
# `CBaseAudioProcessingObject`, a C++ class Rust cannot inherit from).
#
# `staticlib`, not `cdylib`: one DLL to sign, register and deploy rather than two, and no
# cross-DLL boundary on the real-time path.
# `rlib` alongside `staticlib`: the staticlib is what the shim links into CAGEqApo.dll, but
# other Rust code needs to depend on this crate too — the app-side backend, to render config
# files and compute the coefficients it pushes down the control channel, and the example
# writer used to exercise that channel. A staticlib-only crate produces no rlib and cannot be
# depended on at all.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
