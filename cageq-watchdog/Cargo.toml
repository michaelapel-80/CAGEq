[package]
name = "cageq-watchdog"
version.workspace = true
edition = "2024"

[dependencies]
# First cross-crate wiring in the workspace: the watchdog drives the sidecar and,
# on a fault, writes the safe state through the config-writer — independently of
# Python (filter.md §7.1).
cageq-sidecar = { path = "../cageq-sidecar" }
cageq-config-writer = { path = "../cageq-config-writer" }
serde_json = "1.0"
thiserror = "2.0"
