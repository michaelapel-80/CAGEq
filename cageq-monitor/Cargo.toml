# §5.3c post-EQ monitoring: WASAPI render-endpoint loopback capture + BS.1770 loudness metering.
# Independent of the custom-APO work (loopback taps the already-post-EQ mix at the endpoint).
# Real capture is Windows-only (wasapi); the crate still compiles elsewhere as a no-op stub so
# the workspace stays cross-platform, matching the rest of the codebase (e.g. list_render_devices).
[package]
name = "cageq-monitor"
version.workspace = true
edition = "2021"

[dependencies]
ebur128 = "0.1.10"
realfft = "3.5.0"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.23.0"
