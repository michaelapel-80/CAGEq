# Builds the Windows installer and publishes it to a GitHub Release.
#
# Mirrors DEPLOY.md's own maintainer build steps exactly (same scripts, same order) rather than
# reimplementing the process here — see that file if a step here looks unfamiliar. Runs the same
# three stages a human would: build CAGEq's own APO (needs the MSVC C++ toolset), build the
# frontend + Tauri bundle, then locate and publish the resulting .exe. No Python sidecar to
# freeze/bundle any more — the app doesn't ship or depend on one (see cageq-core's "No sidecar"
# module doc); `cageq-sidecar`/`cageq-watchdog` stay in the workspace purely as dev-only
# infrastructure for the `tests/*_vs_sidecar.rs` comparison tests, which this release build
# doesn't run.
#
# Triggers on a version tag push (the real release path) and workflow_dispatch (so the whole
# pipeline can be test-run without cutting a release — see the "Publish release" step's own
# `if:`, which only actually touches Releases on a tag push; a manual run still uploads the
# installer as a workflow artifact so it's inspectable either way).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # softprops/action-gh-release needs this to create/attach to a release

jobs:
  build-windows-installer:
    # Pinned, not windows-latest: build.bat locates the VC++ toolset via vswhere (edition-
    # agnostic), but the C++ workload itself still has to actually be present on the image —
    # windows-2022 ships it, and pinning avoids a future runner-image bump silently changing
    # what's available out from under a release build.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      # The wasm target is for the frontend: `npm run build` (via beforeBuildCommand) first
      # compiles cageq-biquad-wasm, the coefficient design the chart runs, to WebAssembly.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          # Two separate cargo workspaces (root, and cageq-app/src-tauri — see the root
          # Cargo.toml's own doc for why) get their own target dirs, both worth caching.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            cageq-app/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cageq-app/package-lock.json

      # --- 1. CAGEq's own APO: Rust static lib + C++ COM shim, needs the MSVC toolset ---
      - name: Build CAGEq's own APO
        shell: pwsh
        working-directory: cageq-app
        run: ./scripts/build-apo.ps1

      # --- 2. Frontend + Tauri bundle. beforeBuildCommand (tauri.conf.json) re-checks the APO
      # staging is fresh — it is, having just been built above in this same job — before this
      # actually builds the installer. ---
      - name: Install frontend dependencies
        working-directory: cageq-app
        run: npm ci

      # A version bump touches only Cargo.toml/tauri.conf.json, not any Rust source — on a
      # cache restore-keys fallback (the exact Cargo.lock-hash key misses because the lock file
      # just changed, so this falls back to whatever was cached under the previous release),
      # cargo can decide the cageq-app crate itself doesn't need rebuilding and its build
      # script — which is what actually embeds the version tauri.conf.json now names — never
      # reruns, silently leaving a *previous* release's bundle in place. `cargo clean -p` only
      # drops this one crate's own artifacts, not its (slow-to-build) dependencies, so this
      # costs one relink, not a full rebuild — a release build should never trade that for
      # risking a stale-versioned installer.
      - name: Force a fresh build of the app crate itself
        shell: pwsh
        working-directory: cageq-app/src-tauri
        run: cargo clean -p cageq-app --release

      # Removes any bundle output a cache restore-keys fallback (see the step above) may have
      # carried over from a previous release, so "Locate the installer" below can only ever
      # find what this build just produced — never a leftover from an older version.
      - name: Clean stale bundle output
        shell: pwsh
        run: Remove-Item -Recurse -Force "cageq-app\src-tauri\target\release\bundle" -ErrorAction SilentlyContinue

      - name: Build the installer
        working-directory: cageq-app
        run: npm run tauri build -- --bundles nsis

      # --- 3. Locate + publish. Globbed rather than hardcoding the version, so a version bump
      # in tauri.conf.json never needs a matching edit here — but verified against that same
      # version afterwards, so a stale artifact (see the cache note above) fails the build
      # loudly instead of shipping silently under the wrong name.
      - name: Locate the installer
        id: installer
        shell: pwsh
        run: |
          $expected = (Get-Content "cageq-app\src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem -Path "cageq-app\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $exe) { throw "no NSIS installer found under src-tauri\target\release\bundle\nsis" }
          if ($exe.Name -notlike "*_${expected}_*") {
            throw "installer '$($exe.Name)' does not match tauri.conf.json's version ($expected) - stale build artifact?"
          }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.installer.outputs.name }}
          path: ${{ steps.installer.outputs.path }}

      # v0.8.1 shipped with two installers attached to one release (a stray, wrongly-named 0.8.0
      # build sitting alongside the real 0.8.1 one) — traced to a re-run against the same tag
      # (the first attempt shipped a stale-versioned installer, caught and fixed, then re-run):
      # `action-gh-release` below attaches to whatever release already exists for this tag rather
      # than replacing it, so the second run's correct asset landed *next to* the first run's
      # wrong one instead of instead of it. Deleting any existing release for this tag first makes
      # every publish a clean slate regardless of how many times this workflow ever runs against
      # it — `gh release delete` errors when there's nothing to delete (the normal, first-time
      # case), which the trailing `exit 0` swallows on purpose.
      - name: Remove any existing release for this tag (idempotent publish)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes --repo "${{ github.repository }}"
          exit 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.installer.outputs.path }}
          # RELEASE_NOTES.md is a curated, human-written summary for *this* release only (not a
          # cumulative changelog — each release overwrites it) — see DEPLOY.md's maintainer
          # section. generate_release_notes alongside body_path doesn't replace it: per GitHub's
          # Releases API, a given body is *pre-pended* to the auto-generated notes, so this reads
          # as "what actually changed, in plain language" up top, with the full commit list still
          # there below for anyone who wants it.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # The installer isn't code-signed (no certificate configured) — Windows SmartScreen
          # will warn on first run. Not something this workflow can fix on its own; DEPLOY.md
          # doesn't currently mention it either, worth a note there if this becomes a real ask.
